# ============================================================
# k8s/mongo/statefulset.yaml
# MongoDB as a StatefulSet with a PersistentVolumeClaim.
# StatefulSet (not Deployment) because:
#  - Pods get stable DNS names (mongo-0.mongo-svc)
#  - PVC is retained even if the pod is deleted
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: jiraclone
  labels:
    app: mongo
spec:
  serviceName: mongo-svc    # headless service name (defined in service.yaml)
  replicas: 1               # single-node for simplicity; increase for replica sets
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Mount the persistent volume into the default MongoDB data directory
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          # Liveness: mongo responds to ping
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

      volumes:
        - name: mongo-storage
          emptyDir: {}
