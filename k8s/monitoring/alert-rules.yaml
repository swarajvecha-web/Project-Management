# ============================================================
# k8s/monitoring/alert-rules.yaml
# Custom PrometheusRule for JiraClone application alerts
# ============================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jiraclone-alerts
  namespace: monitoring
  labels:
    # This label makes the kube-prometheus-stack Prometheus pick up this rule
    release: monitoring
spec:
  groups:
    # ── Application Alerts ──────────────────────────────────
    - name: jiraclone.application
      rules:

        # Backend pod is down
        - alert: BackendPodDown
          expr: |
            kube_deployment_status_replicas_available{
              namespace="jiraclone",
              deployment="jiraclone-backend"
            } < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "JiraClone backend has 0 available replicas"
            description: "All backend pods are down. Immediate action required."

        # High error rate (5xx responses > 5%)
        - alert: BackendHighErrorRate
          expr: |
            rate(http_requests_total{
              namespace="jiraclone",
              status=~"5.."
            }[5m]) /
            rate(http_requests_total{namespace="jiraclone"}[5m]) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Backend 5xx error rate > 5%"
            description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

        # Pods crash-looping
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace="jiraclone"
            }[15m]) * 60 > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} restarted {{ $value }} times/min."

        # HPA at max replicas (load exceeding capacity)
        - alert: BackendScaledToMax
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{
              namespace="jiraclone",
              horizontalpodautoscaler="backend-hpa"
            } ==
            kube_horizontalpodautoscaler_spec_max_replicas{
              namespace="jiraclone",
              horizontalpodautoscaler="backend-hpa"
            }
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Backend HPA at maximum replicas"
            description: "The backend is at max capacity. Consider increasing max replicas."

    # ── Infrastructure Alerts ───────────────────────────────
    - name: jiraclone.infrastructure
      rules:

        # Node CPU > 80%
        - alert: NodeHighCPU
          expr: |
            100 - (avg by(instance) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            ) * 100) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} CPU > 80%"
            description: "CPU usage is {{ $value }}%. Check for runaway processes."

        # Node disk usage > 85%
        - alert: NodeDiskAlmostFull
          expr: |
            (1 - (node_filesystem_avail_bytes{mountpoint="/"}
                  / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} disk is {{ $value }}% full"
            description: "Disk will fill up soon. Clean up or expand volume."

        # MongoDB PVC > 80% full
        - alert: MongoPVCAlmostFull
          expr: |
            (kubelet_volume_stats_used_bytes{namespace="jiraclone"}
             / kubelet_volume_stats_capacity_bytes{namespace="jiraclone"}) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "MongoDB PVC is {{ $value }}% full"
            description: "Expand the MongoDB PersistentVolumeClaim before it runs out."
