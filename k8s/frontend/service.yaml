# ============================================================
# k8s/frontend/service.yaml
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: jiraclone-frontend
  namespace: jiraclone
  labels:
    app: jiraclone-frontend
spec:
  type: ClusterIP
  selector:
    app: jiraclone-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
