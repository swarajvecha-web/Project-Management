# ============================================================
# docker-compose.yml – JiraClone local development stack
#
# Services
#   mongo    – MongoDB 6 with persistent named volume
#   backend  – Express API with nodemon hot-reload
#   frontend – React dev server (CRA)
#
# Usage:
#   docker compose up --build
# ============================================================

# version key removed — obsolete in Docker Compose v2+

# ── Named volumes ────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────
networks:
  jiraclone_net:
    driver: bridge

# ── Services ─────────────────────────────────────────────────
services:

  # ── 1. MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:6
    container_name: jiraclone_mongo
    restart: unless-stopped
    networks:
      - jiraclone_net
    ports:
      - "27017:27017"          # expose for local tools like Compass
    volumes:
      - mongo_data:/data/db    # persist data across restarts
    environment:
      MONGO_INITDB_DATABASE: jiraclone
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── 2. Backend (Express + nodemon hot-reload) ────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jiraclone_backend
    restart: unless-stopped
    networks:
      - jiraclone_net
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env          # load all server env vars from file
    environment:
      # Override MONGODB_URI so it points to the Docker service, not Atlas
      MONGODB_URI: mongodb://mongo:27017/jiraclone
      PORT: 8000
      NODE_ENV: development
    volumes:
      # Mount source code for hot-reload; exclude node_modules from host
      - ./backend:/app
      - /app/node_modules
    # Override CMD to use nodemon for hot-reload in development
    command: ["./node_modules/.bin/nodemon", "app.js"]
    depends_on:
      mongo:
        condition: service_healthy

  # ── 3. Frontend (Create React App dev server) ────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder           # stop at the builder stage (use CRA dev server)
    container_name: jiraclone_frontend
    restart: unless-stopped
    networks:
      - jiraclone_net
    ports:
      - "3000:3000"
    environment:
      # CRA bakes this into the bundle at build time; from the browser
      # this must be reachable on the HOST, so localhost is correct here.
      REACT_APP_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"   # required for file-watch inside Docker on Windows/macOS
      WDS_SOCKET_PORT: 0            # avoids WebSocket port mismatch in CRA
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Override the nginx CMD to use the CRA dev server instead
    command: ["npm", "start"]
    depends_on:
      - backend
    stdin_open: true              # keep stdin open (needed by react-scripts)
    tty: true
